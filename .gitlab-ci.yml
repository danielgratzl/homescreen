# Build and publish the homescreen image to the GitLab container registry.
#
#   merge requests      → lint + test build (amd64, not pushed)
#   default branch      → :latest and :<short-sha>          (amd64 + arm64)
#   tag v1.2.3          → :1.2.3, :1.2 and :<short-sha>      (amd64 + arm64)
#
# Requires a runner that can run Docker-in-Docker (privileged). GitLab.com
# shared runners work out of the box.

stages:
  - test
  - build

variables:
  IMAGE: $CI_REGISTRY_IMAGE            # override to push elsewhere (e.g. docker.io/you/homescreen)
  PLATFORMS: linux/amd64,linux/arm64
  DOCKER_TLS_CERTDIR: "/certs"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never                      # avoid duplicate branch + MR pipelines
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Test ────────────────────────────────────────────────────────────────────

lint:
  stage: test
  image: golang:1.27-alpine
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key:
      files: [go.sum]
    paths: [.go/pkg/mod/]
  script:
    - test -z "$(gofmt -l main.go)" || { echo "gofmt needed:"; gofmt -d main.go; exit 1; }
    - go vet ./...
    - CGO_ENABLED=0 go build -o /dev/null .

# ── Build ───────────────────────────────────────────────────────────────────

.docker:
  image: docker:29
  services:
    - docker:29-dind
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 1; done
    # QEMU so the amd64 runner can build the arm64 variant
    - docker run --rm --privileged tonistiigi/binfmt --install arm64
    - docker buildx create --name multiarch --driver docker-container --use
    - docker buildx inspect --bootstrap >/dev/null

build:mr:
  extends: .docker
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - docker buildx build --platform linux/amd64 --output type=cacheonly .

publish:
  extends: .docker
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      TAGS="--tag $IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        TAGS="$TAGS --tag $IMAGE:$VERSION --tag $IMAGE:${VERSION%.*}"
      else
        VERSION="$CI_COMMIT_SHORT_SHA"
        TAGS="$TAGS --tag $IMAGE:latest"
      fi
      echo "Publishing $IMAGE ($TAGS) for $PLATFORMS"
    - >
      docker buildx build
      --platform "$PLATFORMS"
      $TAGS
      --label "org.opencontainers.image.title=homescreen"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.version=$VERSION"
      --cache-from "type=registry,ref=$IMAGE:buildcache"
      --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max"
      --push
      .
