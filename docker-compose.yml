services:
  homescreen:
    # Build locally…
    build: .
    image: homescreen:latest
    # …or use the image published by the GitHub workflow (replace the two lines above):
    # image: ghcr.io/danielgratzl/homescreen:latest
    container_name: homescreen
    ports:
      - "8090:8080"
    volumes:
      - ./config:/config:ro   # config.yaml, icons/, optional wallpaper image
    restart: unless-stopped
